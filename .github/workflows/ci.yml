name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  linux:
    name: Linux (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Configure headless build
        run: cmake --preset headless -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset headless

      - name: Test
        run: ctest --preset headless

      - name: Install SDK
        run: cmake --install build/headless --prefix "$RUNNER_TEMP/meat2d-install"

      - name: Configure package consumer
        run: >-
          cmake -S tests/package_consumer
          -B "$RUNNER_TEMP/meat2d-consumer"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/meat2d-install"

      - name: Build package consumer
        run: cmake --build "$RUNNER_TEMP/meat2d-consumer"

      - name: Build release archives
        run: cmake --build build/headless --target package

      - name: Verify release archives
        shell: bash
        run: |
          test -n "$(find build/headless -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"

  windows:
    name: Windows (MSVC)
    # Keep the MSVC generator aligned with the broadly available hosted image.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure headless build
        run: >-
          cmake -S . -B build/windows
          -G "Visual Studio 17 2022"
          -A x64
          -DMEAT2D_BUILD_CLIENT=OFF
          -DMEAT2D_BUILD_LAUNCHER=OFF
          -DMEAT2D_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build/windows --config Debug --parallel

      - name: Test
        run: ctest --test-dir build/windows --build-config Debug --output-on-failure

  sanitizers:
    name: Linux (${{ matrix.sanitizer }} sanitizer)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            preset: asan-headless
          - sanitizer: undefined
            preset: ubsan-headless
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
